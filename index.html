<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitor de Mangá</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #121212; color: #fff; font-family: sans-serif; padding-top: 70px; }
        
        /* Barra superior estilo FoolSlide */
        header { position: fixed; top: 0; left: 0; width: 100%; height: 60px; background: #1e1e1e; border-bottom: 2px solid #333; display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .controls { display: flex; gap: 15px; align-items: center; }
        
        /* Botões de navegação */
        .btn-nav { background-color: #ff4757; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; text-decoration: none; transition: background 0.2s; font-size: 14px; }
        .btn-nav:hover { background-color: #ff6b81; }
        .btn-nav:disabled, .btn-nav.disabled { background-color: #444; color: #888; cursor: not-allowed; }
        
        #manga-title { font-size: 16px; font-weight: bold; margin: 0 10px; text-transform: uppercase; }
        
        /* Container das Imagens */
        #manga-container { display: flex; flex-direction: column; align-items: center; max-width: 800px; margin: 20px auto; padding: 0 10px; }
        #manga-container img { max-width: 100%; height: auto; margin-bottom: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); display: block; }
        .msg { text-align: center; padding: 40px; color: #ff4757; font-weight: bold; line-height: 1.6; }
    </style>
</head>
<body>

    <header>
        <div class="controls">
            <button id="btn-ant" class="btn-nav">◀ Anterior</button>
            <span id="manga-title">Carregando...</span>
            <button id="btn-prox" class="btn-nav">Próximo ▶</button>
        </div>
    </header>

    <main id="manga-container">
        <p id="status-msg" class="msg" style="color: #888;">Conectando ao banco de dados (Blogger)...</p>
    </main>

    <script>
        // CONFIGURAÇÃO: Digite a URL do seu blogger aqui (sem https:// e sem barra final)
        const URL_DO_BLOG = "yanderescan.blogspot.com"; 

        // Captura o parâmetro da URL. Ex: ?manga=one-piece-1
        const urlParams = new URLSearchParams(window.location.search);
        const mangaParametros = urlParams.get('manga');

        const container = document.getElementById('manga-container');
        const titleElement = document.getElementById('manga-title');
        const btnAnt = document.getElementById('btn-ant');
        const btnProx = document.getElementById('btn-prox');

        let mangaNomeBase = "";
        let capituloAtual = 1;

        // Processa o parâmetro da URL para separar o NOME do NÚMERO
        if (mangaParametros) {
            const partes = mangaParametros.split('-');
            capituloAtual = parseInt(partes.pop()); // Pega o último número (ex: 1)
            mangaNomeBase = partes.join('-'); // Junta o resto de volta (ex: one-piece)
        }

        // Configura os links dos botões antes mesmo da página carregar tudo
        function configurarBotoes() {
            if (capituloAtual <= 1) {
                btnAnt.disabled = true;
                btnAnt.classList.add('disabled');
            } else {
                btnAnt.onclick = () => {
                    window.location.search = `?manga=${mangaNomeBase}-${capituloAtual - 1}`;
                };
            }

            btnProx.onclick = () => {
                window.location.search = `?manga=${mangaNomeBase}-${capituloAtual + 1}`;
            };
        }

        // Esta função recebe as imagens vindo da API da Google
        window.processarDadosBlogger = function(data) {
            try {
                if (!data.feed || !data.feed.entry || data.feed.entry.length === 0) {
                    titleElement.textContent = "Fim do Mangá";
                    container.innerHTML = `<p class="msg">Você chegou ao último capítulo lançado ou este capítulo ainda não existe!</p>`;
                    btnProx.disabled = true;
                    btnProx.classList.add('disabled');
                    return;
                }

                const postagem = data.feed.entry[0]; 
                titleElement.textContent = postagem.title['\$t'];

                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = postagem.content['\$t'];
                const imagens = tempDiv.getElementsByTagName('img');

                if (imagens.length === 0) {
                    container.innerHTML = `<p class="msg">Este capítulo não possui imagens.</p>`;
                    return;
                }

                container.innerHTML = ""; // Limpa o carregando
                
                for (let i = 0; i < imagens.length; i++) {
                    const novaImg = document.createElement('img');
                    let urlLimpa = imagens[i].src.replace(/\/s[0-9]+(-c)?\//, '/s1600/');
                    urlLimpa = urlLimpa.replace(/=w[0-9]+-h[0-9]+.*/, '=s0');
                    novaImg.src = urlLimpa;
                    novaImg.loading = "lazy";
                    container.appendChild(novaImg);
                }

            } catch (error) {
                titleElement.textContent = "Erro";
                container.innerHTML = `<p class="msg">Erro ao processar imagens: ${error.message}</p>`;
            }
        };

        function carregarManga() {
            if (!mangaParametros || isNaN(capituloAtual)) {
                titleElement.textContent = "Erro";
                container.innerHTML = `<p class="msg">URL Inválida.<br>Use o formato: <strong>?manga=nome-do-manga-1</strong></p>`;
                btnAnt.style.display = 'none';
                btnProx.style.display = 'none';
                return;
            }

            configurarBotoes();

            // Injeta o script JSONP chamando o marcador completo (ex: one-piece-1)
            const script = document.createElement('script');
            script.src = `https://${URL_DO_BLOG}/feeds/posts/default/-/${mangaParametros}?alt=json-in-script&callback=processarDadosBlogger&max-results=1`;
            
            script.onerror = function() {
                titleElement.textContent = "Erro";
                container.innerHTML = `<p class="msg">Erro ao conectar ao banco de dados.</p>`;
            };

            document.body.appendChild(script);
        }

        carregarManga();
    </script>
</body>
</html>
