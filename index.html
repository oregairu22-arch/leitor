<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitor de Mangá</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #121212; color: #fff; font-family: sans-serif; padding-top: 60px; }
        header { position: fixed; top: 0; left: 0; width: 100%; height: 60px; background: #1e1e1e; border-bottom: 2px solid #333; display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .controls { display: flex; gap: 15px; align-items: center; }
        #manga-container { display: flex; flex-direction: column; align-items: center; max-width: 800px; margin: 20px auto; padding: 0 10px; }
        #manga-container img { max-width: 100%; height: auto; margin-bottom: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); display: block; }
        .msg { text-align: center; padding: 40px; color: #ff4757; font-weight: bold; line-height: 1.6; }
    </style>
</head>
<body>

    <header>
        <div class="controls">
            <span id="manga-title">Carregando capítulo...</span>
        </div>
    </header>

    <main id="manga-container">
        <p class="msg" style="color: #888;">Conectando ao banco de dados...</p>
    </main>

    <script>
        // CONFIGURAÇÃO: Digite a URL do seu blogger aqui (sem https:// e sem barra final)
        const URL_DO_BLOG = "yanderescan.blogspot.com"; 

        const urlParams = new URLSearchParams(window.location.search);
        const mangaMarcador = urlParams.get('manga');

        async function carregarManga() {
            const container = document.getElementById('manga-container');
            const titleElement = document.getElementById('manga-title');

            if (!mangaMarcador) {
                titleElement.textContent = "Erro";
                container.innerHTML = `<p class="msg">Por favor, insira o nome do mangá na URL.<br>Exemplo: ?manga=nome-do-marcador</p>`;
                return;
            }

            try {
                // Puxa o conteúdo via API Feed pública da Google
                const response = await fetch(`https://${URL_DO_BLOG}/feeds/posts/default/-/${mangaMarcador}?alt=json&max-results=1`);
                if (!response.ok) throw new Error("Blog não encontrado ou Feed desativado.");

                const data = await response.json();
                
                if (!data.feed || !data.feed.entry || data.feed.entry.length === 0) {
                    titleElement.textContent = "Não encontrado";
                    container.innerHTML = `<p class="msg">Nenhum capítulo publicado com o marcador: "${mangaMarcador}"</p>`;
                    return;
                }

                const postagem = data.feed.entry[0];
                titleElement.textContent = postagem.title['\$t'];

                // Extrai as imagens de dentro do post
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = postagem.content['\$t'];
                const imagens = tempDiv.getElementsByTagName('img');

                if (imagens.length === 0) {
                    container.innerHTML = `<p class="msg">Este capítulo foi encontrado, mas não possui imagens dentro dele.</p>`;
                    return;
                }

                container.innerHTML = "";
                for (let i = 0; i < imagens.length; i++) {
                    const novaImg = document.createElement('img');
                    let urlLimpa = imagens[i].src.replace(/\/s[0-9]+(-c)?\//, '/s1600/');
                    urlLimpa = urlLimpa.replace(/=w[0-9]+-h[0-9]+.*/, '=s0');
                    novaImg.src = urlLimpa;
                    novaImg.loading = "lazy";
                    container.appendChild(novaImg);
                }

            } catch (error) {
                titleElement.textContent = "Erro de Conexão";
                container.innerHTML = `<p class="msg">Erro ao carregar mangá: ${error.message}<br><small>Verifique se as configurações de Feed do seu Blogger estão como 'Completo'.</small></p>`;
            }
        }

        carregarManga();
    </script>
</body>
</html>
